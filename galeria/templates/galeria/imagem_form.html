{% extends 'galeria/base.html' %}

{% block title %}Formulário de Imagem{% endblock %}

{% block content %}

<h2>{% if imagem %}Editar{% else %}Nova{% endif %} Imagem</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar</button>
</form>

<a href="{% url 'imagem_list' %}">Cancelar</a>

{% endblock %}
